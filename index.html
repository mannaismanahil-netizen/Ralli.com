<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RALLI</title>
    <style>
        /* Base Canvas Settings */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ede6c9;
            color: #333;
            font-family: 'Times New Roman', Times, serif;
            text-align: center;
            overflow-x: hidden;
        }

        /* Hero Section - Centered RALLI Logo */
        .hero-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
        }

        .logo-container img {
            max-width: 250px;
            height: auto;
        }

        .hero-title {
            font-size: 5rem;
            letter-spacing: 0.15em;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .scroll-indicator {
            margin-top: 30px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* Game Section */
        .game-section {
            min-height: 100vh;
            padding: 60px 20px;
            background-color: #e3dac1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #d4c8a8;
        }

        .game-title {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .game-subtitle {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 40px;
            font-style: italic;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            align-items: center;
            max-width: 900px;
            width: 100%;
        }

        /* Outfit Display Frame */
        .display-frame {
            background: #ede6c9;
            border: 2px solid #333;
            width: 300px;
            height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: 8px 8px 0px #333;
            position: relative;
        }

        .display-frame img {
            max-width: 80%;
            max-height: 250px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .item-label {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 10px;
        }

        /* Controls Area */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 280px;
        }

        .game-btn {
            background-color: #333;
            color: #ede6c9;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-family: inherit;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 4px 4px 0px #777;
        }

        .game-btn:hover {
            background-color: #555;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #777;
        }

        .game-btn:active {
            transform: translate(0, 0);
            box-shadow: 2px 2px 0px #777;
        }

        .score-board {
            margin-top: 30px;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- HERO SECTION (Centered RALLI Logo) -->
    <section class="hero-section">
        <!-- Displaying logo image if available, fallback to text styling -->
        <div class="logo-container">
            <img src="logo.png" alt="RALLI" onerror="this.style.display='none'; document.getElementById('alt-title').style.display='block';">
            <h1 id="alt-title" class="hero-title" style="display:none;">RALLI.</h1>
        </div>
        <div class="scroll-indicator">↓ Scroll to Play ↓</div>
    </section>

    <!-- GAME SECTION -->
    <section class="game-section" id="game">
        <h2 class="game-title">RALLI Studio</h2>
        <p class="game-subtitle">Mix, Match & Style Sustainable Pieces</p>

        <div class="game-container">
            <!-- Outfit Display Box -->
            <div class="display-frame">
                <img id="outfit-img" src="jeans-box.png" alt="RALLI Piece" onerror="this.src='gameicon.jpg'">
                <div class="item-label" id="item-name">Upcycled Denim Jeans</div>
            </div>

            <!-- Game Control Buttons -->
            <div class="controls">
                <button class="game-btn" onclick="nextPiece()">Next Piece ↻</button>
                <button class="game-btn" onclick="stylePiece()">Style This Look ✨</button>
                <button class="game-btn" onclick="randomize()">Random Outfit 🎲</button>
            </div>
        </div>

        <div class="score-board">
            Styled Outfits: <span id="outfit-count">0</span>
        </div>
    </section>

    <script>
        // Item collection based on files in repository
        const inventory = [
            { name: "Upcycled Denim Jeans", img: "jeans-box.png" },
            { name: "Vintage Newspaper Top", img: "newspaper-box.png" },
            { name: "Eco Combo Set", img: "combo-box.png" },
            { name: "Mannequin Display Piece", img: "mannequin-view.png" },
            { name: "RALLI Pick Box", img: "pickabox.jpeg" }
        ];

        let currentIndex = 0;
        let count = 0;

        function updateDisplay() {
            const item = inventory[currentIndex];
            document.getElementById('outfit-img').src = item.img;
            document.getElementById('item-name').innerText = item.name;
        }

        function nextPiece() {
            currentIndex = (currentIndex + 1) % inventory.length;
            updateDisplay();
        }

        function stylePiece() {
            count++;
            document.getElementById('outfit-count').innerText = count;
            alert('Styled! Added ' + inventory[currentIndex].name + ' to your collection.');
        }

        function randomize() {
            currentIndex = Math.floor(Math.random() * inventory.length);
            updateDisplay();
        }
    </script>
</body>
</html>
