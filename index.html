<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RALLI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #F4F1EA; /* Muted stone beige */
            font-family: 'Cormorant Garamond', serif;
            -webkit-font-smoothing: antialiased;
            color: #111111;
            overflow-x: hidden;
        }

        .section-view {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 40px 24px;
        }

        /* Minimalist Logo */
        #brand-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.8rem;
            font-weight: 300;
            letter-spacing: 16px;
            text-transform: uppercase;
            margin-left: 16px; /* Balance trailing letter-spacing */
            cursor: pointer;
            user-select: none;
            opacity: 1;
            position: absolute;
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2;
        }

        #brand-logo.hidden {
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
        }

        /* Menu Container */
        .icon-menu-row {
            display: flex;
            width: 100%;
            max-width: 1050px;
            justify-content: center;
            align-items: center;
            gap: 40px;
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
            transition: opacity 0.7s ease 0.1s, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
            z-index: 1;
        }

        .icon-menu-row.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            flex: 1;
            max-width: 280px;
            text-decoration: none;
            color: #111111;
            cursor: pointer;
        }

        .icon-square {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(17, 17, 17, 0.15);
            background-color: #EFECE6;
            overflow: hidden;
            transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .icon-square img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .icon-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .icon-wrapper:hover .icon-square {
            transform: translateY(-4px);
            border-color: rgba(17, 17, 17, 0.5);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.04);
        }

        .icon-wrapper:hover .icon-square img {
            transform: scale(1.03);
        }

        .icon-wrapper:hover .icon-label {
            opacity: 1;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            html, body {
                overflow-y: auto;
            }

            .section-view {
                padding: 60px 20px;
                min-height: 100vh;
                height: auto;
            }

            #brand-logo { 
                font-size: 2.4rem;
                letter-spacing: 10px;
                margin-left: 10px;
            }

            .icon-menu-row { 
                flex-direction: column;
                width: 100%;
                gap: 36px;
                padding: 40px 0;
            }

            .icon-wrapper {
                width: 100%;
                max-width: 220px;
            }

            .icon-label { 
                font-size: 0.7rem; 
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <div class="section-view">
        <h1 id="brand-logo" onclick="revealDashboard()">RALLI.</h1>

        <div class="icon-menu-row" id="menu-row">
            <div class="icon-wrapper">
                <div class="icon-square">
                    <img src="icon1.jpeg" alt="Journey">
                </div>
                <span class="icon-label">Journey</span>
            </div>

            <div class="icon-wrapper">
                <div class="icon-square">
                    <img src="icon3.jpg" alt="Concept">
                </div>
                <span class="icon-label">Concept</span>
            </div>

            <div class="icon-wrapper">
                <div class="icon-square">
                    <img src="IMG_9022.jpeg" alt="Your Role">
                </div>
                <span class="icon-label">Your Role</span>
            </div>
        </div>
    </div>

    <script>
        function revealDashboard() {
            const logo = document.getElementById('brand-logo');
            const menuRow = document.getElementById('menu-row');

            logo.classList.add('hidden');
            menuRow.classList.add('visible');
        }
    </script>

</body>
</html>
