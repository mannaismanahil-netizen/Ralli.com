<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RALLI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #2b1f1d;
            font-family: 'Noto Nastaliq Urdu', serif;
            -webkit-font-smoothing: antialiased;
            color: #FAF4E8;
            overflow-x: hidden;
        }

        .section-view {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        /* Larger Centered Urdu Logo */
        #brand-logo {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 14rem; /* Increased size for impact */
            font-weight: 700;
            line-height: 1;
            margin: 0;
            cursor: pointer;
            user-select: none;
            opacity: 1;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 2;
            white-space: nowrap;
            direction: rtl;
            color: #FAF4E8;
            -webkit-text-stroke: 2px #211311;
            text-shadow: 
                0 0 15px rgba(33, 19, 17, 0.8),
                0 6px 25px rgba(0, 0, 0, 0.7);
        }

        #brand-logo.hidden {
            opacity: 0;
            transform: translate(-50%, -55%) scale(0.92);
            pointer-events: none;
        }

        .logo-container {
            position: relative;
            display: inline-block;
        }

        .urdu-text {
            display: inline-block;
        }

        .custom-dot {
            position: absolute;
            bottom: 0.18em;
            left: -0.22em;
            width: 0.11em;
            height: 0.11em;
            background-color: #FAF4E8;
            border: 2px solid #211311;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(33, 19, 17, 0.8);
        }

        /* High-Contrast Standout Menu Row */
        .icon-menu-row {
            display: flex;
            width: 92%;
            max-width: 1400px;
            justify-content: center;
            align-items: center;
            gap: 5%;
            padding: 40px 30px;
            border-radius: 24px;
            
            /* Dark blur overlay to isolate cards from background */
            background-color: rgba(20, 10, 9, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(250, 244, 232, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);

            opacity: 0;
            transform: translateY(30px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.8s ease 0.15s, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
            z-index: 1;
        }

        .icon-menu-row.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            flex: 1;
            max-width: 380px;
            text-decoration: none;
            color: #FAF4E8;
            cursor: pointer;
        }

        .icon-square {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 1.5px solid rgba(250, 244, 232, 0.35);
            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .icon-square img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        /* Sharper, Bold Titles */
        .icon-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.05rem;
            font-weight: 600; /* Bold weight for sharpness */
            letter-spacing: 2.5px;
            text-transform: uppercase;
            opacity: 0.95;
            color: #FFFFFF;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8); /* Sharp text depth */
            transition: opacity 0.3s ease, letter-spacing 0.3s ease, color 0.3s ease;
        }

        .icon-wrapper:hover .icon-square {
            transform: translateY(-8px) scale(1.03);
            border-color: #FAF4E8;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .icon-wrapper:hover .icon-square img {
            transform: scale(1.06);
        }

        .icon-wrapper:hover .icon-label {
            opacity: 1;
            letter-spacing: 3.5px;
            color: #FFF6E5;
        }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            #brand-logo { 
                font-size: 10rem; 
            }
        }

        @media (max-width: 768px) {
            html, body {
                overflow-y: auto;
            }

            .section-view {
                padding: 30px 15px;
                min-height: 100vh;
                height: auto;
            }

            #brand-logo { 
                font-size: 7rem !important; /* Prominent size on mobile screens */
                -webkit-text-stroke: 1.5px #211311;
            }

            .custom-dot {
                left: -0.24em;
                bottom: 0.16em;
                border-width: 1.5px;
            }

            .icon-menu-row { 
                flex-direction: column;
                width: 100%;
                gap: 28px;
                padding: 30px 20px;
                border-radius: 18px;
            }

            .icon-wrapper {
                width: 100%;
                max-width: 300px;
                gap: 12px;
            }

            .icon-label { 
                font-size: 0.9rem; 
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <div class="section-view">
        <h1 id="brand-logo" onclick="revealDashboard()">
            <span class="logo-container">
                <span class="urdu-text">رَلی</span>
                <span class="custom-dot"></span>
            </span>
        </h1>

        <div class="icon-menu-row" id="menu-row">
            <div class="icon-wrapper">
                <div class="icon-square">
                    <img src="icon1.jpeg" alt="Journey">
                </div>
                <span class="icon-label">Journey</span>
            </div>

            <div class="icon-wrapper">
                <div class="icon-square">
                    <img src="icon3.jpg" alt="Concept">
                </div>
                <span class="icon-label">Concept</span>
            </div>

            <div class="icon-wrapper">
                <div class="icon-square">
                    <img src="IMG_9022.jpeg" alt="Your Role">
                </div>
                <span class="icon-label">Your Role</span>
            </div>
        </div>
    </div>

    <script>
        function revealDashboard() {
            const logo = document.getElementById('brand-logo');
            const menuRow = document.getElementById('menu-row');

            logo.classList.add('hidden');
            menuRow.classList.add('visible');
        }
    </script>

</body>
</html>
