<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RALLI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #F9F6F0; /* Refined Warm Ecru */
            font-family: 'Bodoni Moda', Georgia, serif;
            -webkit-font-smoothing: antialiased;
            color: #1A1A1A; /* Charcoal Black */
            overflow-x: hidden;
        }

        /* Full Screen Container */
        .section-view {
            width: 100vw;
            min-height: 100vh;
            display: grid;
            place-items: center;
            position: relative;
            padding: 40px 20px;
        }

        /* Chic High-Fashion Logo */
        #brand-logo {
            font-family: 'Bodoni Moda', Georgia, serif;
            font-size: 6rem;
            font-weight: 500;
            letter-spacing: 12px;
            text-transform: uppercase;
            margin: 0;
            cursor: pointer;
            user-select: none;
            opacity: 1;
            grid-area: 1 / 1;
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2;
        }

        #brand-logo.hidden {
            opacity: 0;
            transform: scale(0.96);
            pointer-events: none;
        }

        /* 3 Icons Menu Row */
        .icon-menu-row {
            grid-area: 1 / 1;
            display: flex;
            width: 90%;
            max-width: 1400px;
            justify-content: center;
            align-items: center;
            gap: 5%;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: opacity 0.8s ease 0.1s, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
            z-index: 1;
        }

        .icon-menu-row.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            flex: 1;
            max-width: 400px;
            text-decoration: none;
            color: #1A1A1A;
            cursor: pointer;
        }

        .icon-square {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(26, 26, 26, 0.12);
            background-color: #FFFFFF;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .icon-square img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(15%) contrast(102%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
        }

        .icon-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.75;
            transition: opacity 0.3s ease, letter-spacing 0.3s ease;
        }

        /* Hover Interaction */
        .icon-wrapper:hover .icon-square {
            transform: translateY(-8px);
            border-color: rgba(26, 26, 26, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.07);
        }

        .icon-wrapper:hover .icon-square img {
            transform: scale(1.04);
            filter: grayscale(0%) contrast(100%);
        }

        .icon-wrapper:hover .icon-label {
            opacity: 1;
            letter-spacing: 4px;
        }

        /* ----------------------------------
           MOBILE RESPONSIVE
        ---------------------------------- */
        @media (max-width: 768px) {
            html, body {
                overflow-y: auto;
            }

            .section-view {
                padding: 60px 24px;
                min-height: 100vh;
                height: auto;
            }

            #brand-logo { 
                font-size: 3.5rem;
                letter-spacing: 6px;
            }

            .icon-menu-row { 
                flex-direction: column;
                width: 100%;
                gap: 40px;
                padding: 20px 0;
            }

            .icon-wrapper {
                width: 100%;
                max-width: 300px;
                gap: 16px;
            }

            .icon-label { 
                font-size: 0.8rem; 
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <div class="section-view">
        <h1 id="brand-logo" onclick="revealDashboard()">RALLI.</h1>

        <div class="icon-menu-row" id="menu-row">
            <!-- Icon 1: Journey -->
            <div class="icon-wrapper">
                <div class="icon-square">
                    <img src="icon1.jpeg" alt="Journey">
                </div>
                <span class="icon-label">Journey</span>
            </div>

            <!-- Icon 2: Concept -->
            <div class="icon-wrapper">
                <div class="icon-square">
                    <img src="icon3.jpg" alt="Concept">
                </div>
                <span class="icon-label">Concept</span>
            </div>

            <!-- Icon 3: Your Role -->
            <div class="icon-wrapper">
                <div class="icon-square">
                    <img src="IMG_9022.jpeg" alt="Your Role">
                </div>
                <span class="icon-label">Your Role</span>
            </div>
        </div>
    </div>

    <script>
        function revealDashboard() {
            const logo = document.getElementById('brand-logo');
            const menuRow = document.getElementById('menu-row');

            logo.classList.add('hidden');
            menuRow.classList.add('visible');
        }
    </script>

</body>
</html>
