<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RALLI</title>
    <style>
        /* Base Settings */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ede6c9;
            color: #333;
            font-family: 'Times New Roman', Times, serif;
            text-align: center;
        }

        /* Hero Section - Perfectly Centered RALLI */
        .hero-section {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
        }

        .hero-title {
            font-size: 5rem;
            letter-spacing: 0.15em;
            font-weight: bold;
        }

        /* Content Layout: 3 Cards Block */
        .main-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 60px 20px;
            flex-wrap: wrap;
        }

        .card {
            background-color: #e3dac1;
            border: 1px solid #333;
            padding: 20px;
            width: 260px;
            border-radius: 8px;
            box-shadow: 4px 4px 0px #333;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .card p {
            font-size: 0.95rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Centered RALLI Text Screen -->
    <section class="hero-section">
        <h1 class="hero-title">RALLI.</h1>
    </section>

    <!-- 3 Cards Block -->
    <section class="main-container">
        <div class="card">
            <img src="icon1.jpeg" alt="Journey">
            <h3>Journey</h3>
            <p>Exploring sustainable fashion and building conscious clothing habits step by step.</p>
        </div>
        <div class="card">
            <img src="icon2.jpeg" alt="Concept">
            <h3>Concept</h3>
            <p>Redefining style through upcycling, minimal footprint, and long-lasting design.</p>
        </div>
        <div class="card">
            <img src="icon3.jpeg" alt="Your Role">
            <h3>Your Role</h3>
            <p>Join the movement, customize your fits, and shape the future of sustainable culture.</p>
        </div>
    </section>

</body>
</html>
