<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RALLI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #2b1f1d;
            font-family: 'Noto Nastaliq Urdu', serif;
            -webkit-font-smoothing: antialiased;
            color: #F2E5D0;
            overflow-x: hidden;
        }

        .section-view {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        /* Centered Urdu Logo with Sharp Outline & Contrast */
        #brand-logo {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 9.5rem;
            font-weight: 700;
            line-height: 1;
            margin: 0;
            cursor: pointer;
            user-select: none;
            opacity: 1;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: opacity 0.4s ease, transform 0.4s ease;
            z-index: 2;
            white-space: nowrap;
            direction: rtl;
            color: #FAF4E8; /* Soft warm ivory fill */
            
            /* Sharp, crisp outline for legibility over busy photo elements */
            -webkit-text-stroke: 1.5px #211311; /* Deep henna-toned crisp border */
            
            /* Multi-layer shadow for pop and contrast against light and dark areas */
            text-shadow: 
                0 0 12px rgba(33, 19, 17, 0.7),
                0 4px 20px rgba(0, 0, 0, 0.6);
        }

        #brand-logo.hidden {
            opacity: 0;
            transform: translate(-50%, -55%) scale(0.95);
            pointer-events: none;
        }

        .logo-container {
            position: relative;
            display: inline-block;
        }

        .urdu-text {
            display: inline-block;
        }

        /* Custom dot matched to the henna-tone stroke and shadow */
        .custom-dot {
            position: absolute;
            bottom: 0.18em;
            left: -0.22em;
            width: 0.11em;
            height: 0.11em;
            background-color: #FAF4E8;
            border: 1.5px solid #211311;
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(33, 19, 17, 0.7);
        }

        /* Card Menu overlay styled to harmonize with background */
        .icon-menu-row {
            display: flex;
            width: 96%;
            max-width: 1600px;
            justify-content: center;
            align-items: center;
            gap: 4%;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: opacity 0.8s ease 0.1s, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
            z-index: 1;
        }

        .icon-menu-row.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            flex: 1;
            max-width: 440px;
            text-decoration: none;
            color: #FAF4E8;
            cursor: pointer;
        }

        .icon-square {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(250, 244, 232, 0.3);
            background-color: rgba(33, 19, 17, 0.4);
            backdrop-filter: blur(8px);
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .icon-square img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .icon-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 2px;
            opacity: 0.85;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            transition: opacity 0.3s ease, letter-spacing 0.3s ease;
        }

        .icon-wrapper:hover .icon-square {
            transform: translateY(-8px) scale(1.02);
            border-color: #FAF4E8;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .icon-wrapper:hover .icon-square img {
            transform: scale(1.05);
        }

        .icon-wrapper:hover .icon-label {
            opacity: 1;
            letter-spacing: 3px;
        }

        @media (max-width: 768px) {
            html, body {
                overflow-y: auto;
            }

            .section-view {
                padding: 40px 20px;
                min-height: 100vh;
                height: auto;
            }

            #brand-logo { 
                font-size: 5rem;
                -webkit-text-stroke: 1.2px #211311;
            }

            .custom-dot {
                left: -0.25em;
                bottom: 0.15em;
                border-width: 1.2px;
            }

            .icon-menu-row { 
                flex-direction: column;
                width: 100%;
                gap: 30px;
                padding: 40px 0;
            }

            .icon-wrapper {
                width: 100%;
                max-width: 320px;
                gap: 12px;
            }

            .icon-label { 
                font-size: 0.85rem; 
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <div class="section-view">
        <h1 id="brand-logo" onclick="revealDashboard()">
            <span class="logo-container">
                <span class="urdu-text">رَلی</span>
                <span class="custom-dot"></span>
            </span>
        </h1>

        <div class="icon-menu-row" id="menu-row">
            <div class="icon-wrapper">
                <div class="icon-square">
                    <img src="icon1.jpeg" alt="Journey">
                </div>
                <span class="icon-label">Journey</span>
            </div>

            <div class="icon-wrapper">
                <div class="icon-square">
                    <img src="icon3.jpg" alt="Concept">
                </div>
                <span class="icon-label">Concept</span>
            </div>

            <div class="icon-wrapper">
                <div class="icon-square">
                    <img src="IMG_9022.jpeg" alt="Your Role">
                </div>
                <span class="icon-label">Your Role</span>
            </div>
        </div>
    </div>

    <script>
        function revealDashboard() {
            const logo = document.getElementById('brand-logo');
            const menuRow = document.getElementById('menu-row');

            logo.classList.add('hidden');
            menuRow.classList.add('visible');
        }
    </script>

</body>
</html>
